<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TAM Schedule Bot Admin</title>
<style>
  :root{--bg:#0f1117;--sur:#1a1d27;--bor:#2e3147;--acc:#4f6ef7;--acc2:#6b84ff;
        --grn:#3ecf8e;--red:#e05260;--amber:#f59e0b;--txt:#e8eaf0;--mut:#7b80a0;
        --mono:'IBM Plex Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;font-size:14px;line-height:1.6;padding:24px 16px}
  h1{font-size:1.25rem;font-weight:700;margin-bottom:2px}
  .sub{color:var(--mut);font-size:.8rem;margin-bottom:24px}
  .wrap{max-width:1100px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .card{background:var(--sur);border:1px solid var(--bor);border-radius:10px;padding:18px}
  .card h2{font-size:.9rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .full{grid-column:1/-1}
  .row{display:flex;gap:8px;margin-bottom:8px}
  input[type=text],input[type=password]{flex:1;background:var(--bg);border:1px solid var(--bor);
    border-radius:6px;color:var(--txt);font-size:.85rem;padding:7px 10px;outline:none}
  input:focus{border-color:var(--acc)}
  button{background:var(--acc);border:none;border-radius:6px;color:#fff;cursor:pointer;
         font-size:.8rem;font-weight:600;padding:7px 14px;transition:background .15s}
  button:hover{background:var(--acc2)}
  button.danger{background:var(--red)}
  button.success{background:var(--grn);color:#0f1117}
  button.outline{background:transparent;border:1px solid var(--bor);color:var(--txt)}
  button.amber{background:var(--amber);color:#0f1117}
  button:disabled{opacity:.4;cursor:not-allowed}
  .list-box{max-height:200px;overflow-y:auto;margin-top:4px;border:1px solid var(--bor);border-radius:6px}
  .item{display:flex;align-items:center;justify-content:space-between;
        padding:6px 10px;font-size:.83rem;border-bottom:1px solid var(--bor)}
  .item:last-child{border-bottom:none}
  .item:hover{background:rgba(255,255,255,.03)}
  .del{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:1rem;line-height:1;padding:0 3px}
  .empty{color:var(--mut);font-size:.78rem;padding:10px}
  .cfg label{display:block;color:var(--mut);font-size:.75rem;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
  .cfg+.cfg{margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:.83rem;margin-top:6px}
  th{background:rgba(79,110,247,.1);color:var(--acc2);font-size:.72rem;font-weight:700;
     letter-spacing:.06em;padding:7px 12px;text-align:left;text-transform:uppercase;
     border-bottom:1px solid var(--bor)}
  td{border-top:1px solid var(--bor);padding:7px 12px}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .stat-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .stat{background:var(--bg);border:1px solid var(--bor);border-radius:6px;padding:8px 14px;font-size:.8rem}
  .stat span{font-size:1.2rem;font-weight:700;color:var(--acc2);display:block}
  #toast{position:fixed;bottom:18px;right:18px;background:var(--sur);border:1px solid var(--bor);
         border-radius:8px;padding:9px 16px;font-size:.8rem;
         transform:translateY(60px);opacity:0;transition:all .25s;z-index:999;max-width:320px}
  #toast.show{transform:translateY(0);opacity:1}
  #toast.ok{border-color:var(--grn);color:var(--grn)}
  #toast.err{border-color:var(--red);color:var(--red)}
  #toast.info{border-color:var(--acc);color:var(--acc2)}
  .badge{font-size:.68rem;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px}
  .b-grn{background:rgba(62,207,142,.15);color:var(--grn)}
  .b-red{background:rgba(224,82,96,.15);color:var(--red)}
  .b-mut{background:rgba(123,128,160,.15);color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📅 TAM Schedule Bot</h1>
  <p class="sub">Weekly module assignments · Tam's team · Powered by TAM_Product_RTM</p>

  <!-- Connection config -->
  <div class="card" style="margin-bottom:16px">
    <h2>⚙️ Connection</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="cfg">
        <label>Render API URL</label>
        <input type="text" id="apiBase" placeholder="https://schedule-bot-api.onrender.com"/>
      </div>
      <div class="cfg">
        <label>Admin Secret</label>
        <input type="password" id="adminSecret" placeholder="your ADMIN_SECRET value"/>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button onclick="saveConfig()">Save Config Locally</button>
      <button class="outline" onclick="testConn()">Test Connection</button>
      <button class="amber" onclick="resetToSeed()" title="Restores 26 RTM topics + 8 team members">↺ Reset to RTM data</button>
    </div>
    <div id="connStatus" style="font-size:.75rem;color:var(--mut);margin-top:6px"></div>
  </div>

  <div class="grid">
    <!-- Topics -->
    <div class="card">
      <h2>🗂 Topics <span id="topicCount" class="badge b-mut">0</span></h2>
      <div class="row">
        <input type="text" id="topicInput" placeholder="Add a topic..."
               onkeydown="if(event.key==='Enter')addItem('topic')"/>
        <button onclick="addItem('topic')">Add</button>
      </div>
      <div class="list-box" id="topicList"><div class="empty">Loading…</div></div>
      <div id="deckInfo" style="font-size:.72rem;color:var(--mut);margin-top:5px;font-family:var(--mono)"></div>
    </div>

    <!-- People -->
    <div class="card">
      <h2>👤 People <span id="personCount" class="badge b-mut">0</span></h2>
      <div class="row">
        <input type="text" id="personInput" placeholder="Add a person..."
               onkeydown="if(event.key==='Enter')addItem('person')"/>
        <button onclick="addItem('person')">Add</button>
      </div>
      <div class="list-box" id="personList"><div class="empty">Loading…</div></div>
    </div>

    <!-- Preview + Send -->
    <div class="card full">
      <h2>📋 Weekly preview <small style="font-weight:400;color:var(--mut);font-size:.8rem">(non-destructive — does not consume the deck)</small></h2>
      <div id="previewBox">
        <div class="empty" style="padding:12px 0">Click Generate Preview to see next week's assignments.</div>
      </div>
      <div class="actions">
        <button class="outline" onclick="loadPreview()">🔄 Generate Preview</button>
        <button class="success" onclick="sendNow()">🚀 Send to Slack Now</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
  // ── Config ───────────────────────────────────────────────────
  function saveConfig() {
    const base = document.getElementById('apiBase').value.trim().replace(/\/$/,'');
    const sec  = document.getElementById('adminSecret').value.trim();
    if (!base) { toast('API URL required','err'); return; }
    localStorage.setItem('wsb_base', base);
    localStorage.setItem('wsb_sec',  sec);
    toast('Config saved','ok');
    loadAll();
  }

  const cfg  = () => ({ base: localStorage.getItem('wsb_base')||'', sec: localStorage.getItem('wsb_sec')||'' });
  const hdrs = () => ({'Content-Type':'application/json','x-admin-secret': cfg().sec});

  window.addEventListener('DOMContentLoaded', () => {
    const c = cfg();
    if (c.base) document.getElementById('apiBase').value = c.base;
    if (c.sec)  document.getElementById('adminSecret').value = c.sec;
    if (c.base) loadAll();
  });

  function loadAll() { loadList('topic'); loadList('person'); }

  // ── API helper ───────────────────────────────────────────────
  async function api(path, method='GET', body=null) {
    const { base } = cfg();
    if (!base) { toast('Set API URL and save config first','err'); throw new Error('no base'); }
    const opts = { method, headers: hdrs() };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(base + path, opts);
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(`${r.status}: ${txt}`);
    }
    return r.json();
  }

  // ── Test connection ──────────────────────────────────────────
  async function testConn() {
    const el = document.getElementById('connStatus');
    el.textContent = 'Testing…'; el.style.color = 'var(--mut)';
    try {
      const d = await api('/health');
      el.textContent = `✓ Connected — ${d.topics} topics · ${d.people} people · server time ${d.ts}`;
      el.style.color = 'var(--grn)';
      toast('Connection OK','ok');
    } catch(e) {
      el.textContent = '✗ ' + e.message;
      el.style.color = 'var(--red)';
      toast('Connection failed','err');
    }
  }

  // ── Reset to seed data ───────────────────────────────────────
  async function resetToSeed() {
    if (!confirm('Reset to RTM seed data?\nThis restores all 26 topics + 8 team members.\nAny custom additions will be removed.')) return;
    try {
      const d = await api('/api/reset','POST');
      toast(`Reset done — ${d.topics} topics · ${d.people} people`,'ok');
      loadAll();
    } catch(e) { toast('Reset failed: '+e.message,'err'); }
  }

  // ── Load list ────────────────────────────────────────────────
  async function loadList(type) {
    const listEl  = document.getElementById(type==='topic' ? 'topicList'   : 'personList');
    const countEl = document.getElementById(type==='topic' ? 'topicCount'  : 'personCount');
    listEl.innerHTML = '<div class="empty">Loading…</div>';
    try {
      const d     = await api('/api/' + (type==='topic' ? 'topics' : 'people'));
      const items = d.items || [];
      countEl.textContent = items.length;
      countEl.className   = 'badge ' + (items.length > 0 ? 'b-grn' : 'b-mut');
      listEl.innerHTML = items.length
        ? items.map(v => `<div class="item"><span>${esc(v)}</span>
            <button class="del" onclick="remove('${type}','${esc(v).replace(/'/g,"\\'")}')">✕</button></div>`).join('')
        : `<div class="empty">No ${type}s yet — click Add or use ↺ Reset.</div>`;
      if (type==='topic' && d.deckRemaining !== undefined)
        document.getElementById('deckInfo').textContent =
          items.length ? `Deck: ${d.deckRemaining} of ${items.length} remaining until reshuffle` : '';
    } catch(e) {
      listEl.innerHTML = `<div class="empty" style="color:var(--red)">${esc(e.message)}</div>`;
    }
  }

  // ── Add item ─────────────────────────────────────────────────
  async function addItem(type) {
    const inp = document.getElementById(type==='topic' ? 'topicInput' : 'personInput');
    const v   = inp.value.trim();
    if (!v) return;
    try {
      await api('/api/' + (type==='topic' ? 'topics' : 'people'), 'POST', { value: v });
      inp.value = '';
      await loadList(type);
      toast(cap(type) + ' added','ok');
    } catch(e) { toast('Failed: ' + e.message, 'err'); }
  }

  // ── Remove item ──────────────────────────────────────────────
  async function remove(type, value) {
    try {
      await api('/api/' + (type==='topic' ? 'topics' : 'people') + '/remove', 'POST', { value });
      await loadList(type);
      toast(cap(type) + ' removed','ok');
    } catch(e) { toast('Failed: ' + e.message, 'err'); }
  }

  // ── Preview ──────────────────────────────────────────────────
  async function loadPreview() {
    const box = document.getElementById('previewBox');
    box.innerHTML = '<div class="empty" style="padding:12px 0">Generating…</div>';
    try {
      const d = await api('/api/preview');
      if (!d.rows || !d.rows.length) {
        box.innerHTML = `<div class="empty" style="padding:12px 0;color:var(--amber)">${d.warning||'No data.'}</div>`;
        return;
      }
      box.innerHTML = `<table>
        <thead><tr><th>#</th><th>Person</th><th>Topic 1</th><th>Topic 2</th></tr></thead>
        <tbody>${d.rows.map((r,i) => `<tr>
          <td style="color:var(--mut)">${i+1}</td>
          <td><strong>${esc(r.person)}</strong></td>
          <td>${esc(r.topic1)}</td>
          <td>${esc(r.topic2)}</td>
        </tr>`).join('')}</tbody></table>`;
    } catch(e) {
      box.innerHTML = `<div class="empty" style="color:var(--red);padding:12px 0">${esc(e.message)}</div>`;
    }
  }

  // ── Send now ─────────────────────────────────────────────────
  async function sendNow() {
    if (!confirm("Send this week's assignments to Slack now?\nThis will consume topics from the deck.")) return;
    try {
      const d = await api('/api/notify','POST');
      toast(`✓ Sent to Slack — ${d.rows.length} members assigned`,'ok');
      loadList('topic'); // refresh deck count
    } catch(e) { toast('Failed: ' + e.message, 'err'); }
  }

  // ── Toast ────────────────────────────────────────────────────
  let tt;
  function toast(msg, type='ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + type;
    clearTimeout(tt);
    tt = setTimeout(() => { el.className = 'toast'; }, 3500);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function cap(s) { return s[0].toUpperCase() + s.slice(1); }
</script>
</body>
</html>
