services:
  - type: web
    name: schedule-bot-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
