services:

  # ── Web Service (API) ──────────────────────────────────────────
  - type: web
    name: schedule-bot-api
    runtime: node
    plan: free            # free IS valid for web type
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SLACK_WEBHOOK_URL
        sync: false       # set manually in Render dashboard
      - key: ADMIN_SECRET
        sync: false       # set manually in Render dashboard
      - key: CRON_SECRET
        sync: false       # set manually in Render dashboard
